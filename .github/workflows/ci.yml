name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Artifacts (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Check Unity reference DLLs exist
        run: |
          ls -la unity || true
          ls -la unity/Unity-2021.3.0f1 || true
          test -f unity/Unity-2021.3.0f1/UnityEditor.dll
          test -f unity/Unity-2021.3.0f1/UnityEngine.dll

      - name: Make build script executable
        run: chmod +x ./build_jenny.sh

      - name: Build (build_jenny.sh)
        run: ./build_jenny.sh

      # Optional: if you have tests and want them
      # - name: Test (solution)
      #   run: dotnet test ./Jenny.sln --nologo --configuration Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            Artifacts/**
          if-no-files-found: warn
          retention-days: 7
