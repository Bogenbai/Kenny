name: Release on tag

on:
  push:
    tags:
      - "v*" # e.g. v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build Artifacts (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Make build script executable
        run: chmod +x ./build_jenny.sh

      - name: Build (build_jenny.sh)
        run: ./build_jenny.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-Linux
          path: |
            Artifacts/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts-Linux
          path: ./release-bundle

      - name: Create archive with folder structure
        run: |
          cd release-bundle
          zip -r -9 Jenny-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            Automated release for tag ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            release-bundle/Jenny-${{ github.ref_name }}.zip
